name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release version tag (e.g. v1.2.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create mods directory for kubejs plugin
        run: mkdir -p mods

      - name: Build KubeJS scripts
        run: npm run build

      - name: Package build output
        run: |
          cd kubejs
          zip -r "../kubejs-scripts-${{ inputs.tag }}.zip" .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.tag }}
          files: kubejs-scripts-${{ inputs.tag }}.zip
          generate_release_notes: true
